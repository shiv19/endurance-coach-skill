version: "2.0"

athlete:
  name: "Beginner Runner"
  event: "First 5K"
  eventDate: "2025-04-20"
  paces:
    easy: "11:00/mi"
    long: "11:30/mi"
    tempo: "9:45/mi"
    threshold: "9:15/mi"
    r400: "2:00"
    r800: "4:15"
  zones:
    hr:
      lthr: 165
  constraints:
    daysPerWeek: 4
    notes:
      - "Morning runs preferred"
      - "No running on Fridays"
  unit: mi
  firstDayOfWeek: monday

phases:
  - name: "Base"
    weeks: "1-3"
    focus: "Build aerobic foundation and running habit"
    keyWorkouts:
      - "Easy runs"
      - "Long run"
  - name: "Build"
    weeks: "4-6"
    focus: "Introduce tempo work and build endurance"
    keyWorkouts:
      - "Tempo runs"
      - "Strides"
  - name: "Peak"
    weeks: "7-8"
    focus: "Race preparation and confidence building"
    keyWorkouts:
      - "Race pace work"
      - "Short intervals"

weeks:
  # Base Phase - Weeks 1-3
  - week: 1
    phase: Base
    focus: "Establish routine"
    workouts:
      Mon: run.easy(25)
      Wed: run.easy(30)
      Sat: run.long(40)

  - week: 2
    phase: Base
    focus: "Build consistency"
    workouts:
      Mon: run.easy(30)
      Wed: run.easy(30)
      Thu: run.easy(25)
      Sat: run.long(45)

  - week: 3
    phase: Base
    focus: "Increase volume slightly"
    workouts:
      Mon: run.easy(30)
      Wed: run.strides(30, 4)
      Thu: run.easy(25)
      Sat: run.long(50)

  # Build Phase - Weeks 4-6
  - week: 4
    phase: Build
    focus: "Introduce tempo"
    workouts:
      Mon: run.easy(30)
      Wed: run.tempo(15)
      Thu: run.recovery(20)
      Sat: run.long(55)

  - week: 5
    phase: Build
    focus: "Build tempo duration"
    workouts:
      Mon: run.easy(30)
      Wed: run.tempo(20)
      Thu: run.easy(25)
      Sat: run.long(60)

  - week: 6
    phase: Build
    focus: "Add speed work"
    isRecoveryWeek: false
    workouts:
      Mon: run.easy(30)
      Wed: run.intervals.400(4)
      Thu: run.recovery(20)
      Sat: run.long(50)

  # Peak Phase - Weeks 7-8
  - week: 7
    phase: Peak
    focus: "Race simulation"
    workouts:
      Mon: run.easy(30)
      Wed: run.tempo(15)
      Thu: run.strides(25, 6)
      Sat: run.long(45)

  - week: 8
    phase: Peak
    focus: "Taper and race!"
    isRecoveryWeek: true
    workouts:
      Mon: run.easy(25)
      Wed: run.strides(20, 4)
      Thu: run.recovery(15)
      Sun: run.race.5k

raceStrategy:
  goalTime: "30:00"
  pacing:
    run: "Start at 10:00/mi, build to 9:30/mi by finish"
  notes:
    - "Start conservatively - first mile slightly slower than goal pace"
    - "Pick up pace gradually in mile 2"
    - "Give everything you have in the final kilometer"
    - "Stay hydrated the day before"
